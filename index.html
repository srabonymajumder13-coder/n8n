<!DOCTYPE html>
<html>
<head>
  <title>Amazon Scraper</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

    body {
      background: radial-gradient(circle at top, #0f172a, #020617);
      display: flex; justify-content: center; align-items: center;
      height: 100vh; color: #e5e7eb;
    }

    .box {
      width: 1000px;
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(16px);
      padding: 35px;
      border-radius: 22px;
      box-shadow: 0 25px 70px rgba(0,0,0,0.8);
      border: 1px solid rgba(255,255,255,0.06);
    }

    .header { text-align: center; margin-bottom: 20px; }

    h2 {
      font-size: 28px;
      background: linear-gradient(90deg, #3b82f6, #22c55e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p { color: #9ca3af; font-size: 13px; margin-top: 5px; }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin: 20px 0;
    }

    .card {
      background: #020617;
      padding: 15px;
      border-radius: 14px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .card h3 { font-size: 18px; }
    .card span { font-size: 12px; color: #9ca3af; }

    .inputs { margin-top: 20px; }

    .section-label {
      margin-top: 15px;
      margin-bottom: 8px;
      font-size: 14px;
      color: #9ca3af;
    }

    .checkbox-group label {
      display: block;
      margin-bottom: 6px;
      cursor: pointer;
    }

    .btn-group {
      display: flex; justify-content: center; gap: 15px; margin: 20px 0;
    }

    button {
      padding: 14px 18px;
      border-radius: 12px;
      font-size: 14px;
      cursor: pointer;
      border: none;
      transition: 0.3s;
      min-width: 160px;
    }

    #btn { background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; }
    #btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(59,130,246,0.4); }

    #downloadBtn { background: linear-gradient(135deg, #22c55e, #16a34a); color: white; display: none; }

    #clearBtn { background: #374151; color: white; }

    button:disabled { background: #1f2937; cursor: not-allowed; }

    .status {
      text-align: center;
      margin-top: 10px;
      font-size: 14px;
      padding: 8px 15px;
      border-radius: 20px;
      background: #020617;
      display: inline-block;
    }

    .progress {
      height: 6px;
      background: #1f2937;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 15px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #3b82f6, #22c55e);
      transition: width 0.4s ease;
    }

    .section-title {
      margin-top: 20px;
      font-size: 16px;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .logs {
      margin-top: 20px;
      max-height: 200px;
      overflow-y: auto;
    }

    .log {
      background: #020617;
      padding: 12px;
      margin-top: 10px;
      border-radius: 10px;
      border-left: 4px solid #22c55e;
    }

    .error { border-left: 4px solid #ef4444; }
  </style>
</head>

<body>

<div class="box">

  <div class="header">
    <h2>🚀 Amazon Scraping Dashboard</h2>
    <p>Smart Automation • DataFort Limited</p>
  </div>

  <div class="stats">
    <div class="card"><h3 id="totalRuns">0</h3><span>Total Runs</span></div>
    <div class="card"><h3 id="successRuns">0</h3><span>Success</span></div>
    <div class="card"><h3 id="failRuns">0</h3><span>Failed</span></div>
  </div>

  <!-- INPUTS -->
  <div class="inputs">

    <div class="section-label">Select Categories</div>
    <div class="checkbox-group" id="categories">
      <label><input type="checkbox" value="Beauty/Health & Personal Care"> Beauty / Health & Personal Care</label>
      <label><input type="checkbox" value="Pet Products"> Pet Products</label>
      <label><input type="checkbox" value="Kitchen"> Kitchen</label>
      <label><input type="checkbox" value="Home Improvement"> Home Improvement</label>
      <label><input type="checkbox" value="Baby Products"> Baby Products</label>
    </div>

    <div class="section-label">Select Brands</div>
    <div class="checkbox-group" id="brands">
      <label><input type="checkbox" value="CeraVe"> CeraVe</label>
      <label><input type="checkbox" value="Cetaphil"> Cetaphil</label>
      <label><input type="checkbox" value="Neutrogena"> Neutrogena</label>
      <label><input type="checkbox" value="The Ordinary"> The Ordinary</label>
    </div>

  </div>

  <div class="btn-group">
    <button id="btn" onclick="run()">▶ Run</button>
    <button id="downloadBtn" onclick="downloadSheet()">📥 CSV</button>
    <button id="clearBtn" onclick="clearLogs()">🗑 Clear</button>
  </div>

  <div class="status" id="status">Idle</div>
  <div class="progress"><div class="progress-bar" id="progress"></div></div>

  <div class="section-title">📜 Run History</div>
  <div class="logs" id="logs"></div>

</div>

<script>

const WEBHOOK_URL = "http://localhost:5678/webhook/87bd567e-11a3-4ab7-9d16-1c5c6b75200e";
const SHEET_URL = "https://docs.google.com/spreadsheets/d/16FTYRiC8lp3wBl-XJTtNyBKZYYSEnAWq9GJ21fgiiX8/export?format=csv";

function getLogs(){ return JSON.parse(localStorage.getItem("logs")||"[]"); }
function saveLogs(logs){ localStorage.setItem("logs", JSON.stringify(logs)); }

function updateStats(){
  const logs = getLogs();
  document.getElementById("totalRuns").innerText = logs.length;
  document.getElementById("successRuns").innerText = logs.filter(l=>l.status==='success').length;
  document.getElementById("failRuns").innerText = logs.filter(l=>l.status==='error').length;
}

function render(){
  const logs = getLogs();
  const box = document.getElementById("logs");

  box.innerHTML = logs.slice().reverse().map(l=>`
    <div class="log ${l.status==='error'?'error':''}">
      <b>${l.time}</b><br>${l.message}
    </div>
  `).join("");

  updateStats();
}

async function run(){
  const btn = document.getElementById("btn");
  const status = document.getElementById("status");
  const progress = document.getElementById("progress");
  const downloadBtn = document.getElementById("downloadBtn");

  const categories = Array.from(document.querySelectorAll('#categories input:checked')).map(cb => cb.value);
  const brands = Array.from(document.querySelectorAll('#brands input:checked')).map(cb => cb.value);

  if(categories.length === 0 || brands.length === 0){
    status.innerText = "⚠ Select categories & brands";
    return;
  }

  btn.disabled = true;
  status.innerText = "⏳ Running...";
  progress.style.width = "30%";

  const logs = getLogs();
  const log = {
    time:new Date().toLocaleString(),
    status:"running",
    message:`Running for ${categories.join(", ")} | ${brands.join(", ")}`
  };

  logs.push(log);
  saveLogs(logs);
  render();

  try{
    progress.style.width = "70%";

    await fetch(WEBHOOK_URL,{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ categories, brands })
    });

    log.status="success";
    log.message="Completed ✔";
    status.innerText="✅ Success";
    progress.style.width="100%";
    downloadBtn.style.display="inline-block";

  }catch(e){
    log.status="error";
    log.message="Failed ❌";
    status.innerText="❌ Failed";
  }

  saveLogs(logs);
  render();
  btn.disabled=false;

  setTimeout(()=>progress.style.width="0%",1500);
}

function clearLogs(){
  localStorage.removeItem("logs");
  render();
}

function downloadSheet(){
  const link=document.createElement("a");
  link.href=SHEET_URL;
  link.download="automation-data.csv";
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

render();

</script>

</body>
</html>
