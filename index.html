<!DOCTYPE html>
<html>
<head>
  <title>Amazon Scraper</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

    body {
      background: radial-gradient(circle at top, #0f172a, #020617);
      display: flex; justify-content: center; align-items: center;
      height: 100vh; color: #e5e7eb;
    }

    .box {
      width: 1000px;
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(16px);
      padding: 35px;
      border-radius: 22px;
      box-shadow: 0 25px 70px rgba(0,0,0,0.8);
      border: 1px solid rgba(255,255,255,0.06);
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    h2 {
      font-size: 28px;
      background: linear-gradient(90deg, #3b82f6, #22c55e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p { color: #9ca3af; font-size: 13px; margin-top: 5px; }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin: 20px 0;
    }

    .card {
      background: #020617;
      padding: 15px;
      border-radius: 14px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .card h3 { font-size: 18px; }
    .card span { font-size: 12px; color: #9ca3af; }

    .btn-group {
      display: flex; justify-content: center; gap: 15px; margin: 20px 0;
    }

    button {
      padding: 14px 18px;
      border-radius: 12px;
      font-size: 14px;
      cursor: pointer;
      border: none;
      transition: 0.3s;
      min-width: 160px;
    }

    #btn { background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; }
    #btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(59,130,246,0.4); }

    #downloadBtn { background: linear-gradient(135deg, #22c55e, #16a34a); color: white; display: none; }

    #clearBtn { background: #374151; color: white; }

    button:disabled { background: #1f2937; cursor: not-allowed; }

    .status {
      text-align: center;
      margin-top: 10px;
      font-size: 14px;
      padding: 8px 15px;
      border-radius: 20px;
      background: #020617;
      display: inline-block;
    }

    .progress {
      height: 6px;
      background: #1f2937;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 15px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #3b82f6, #22c55e);
      transition: width 0.4s ease;
    }

    .section-title {
      margin-top: 20px;
      font-size: 16px;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .logs {
      margin-top: 20px;
      max-height: 200px;
      overflow-y: auto;
    }

    .log {
      background: #020617;
      padding: 12px;
      margin-top: 10px;
      border-radius: 10px;
      border-left: 4px solid #22c55e;
    }

    .error { border-left: 4px solid #ef4444; }

    /* ================= SIDEBAR (ADDED ONLY) ================= */

    .menu-btn{
      position: fixed;
      top: 20px;
      left: 20px;
      background:#111827;
      padding:10px 14px;
      border-radius:10px;
      cursor:pointer;
      z-index: 1000;
      border:1px solid rgba(255,255,255,0.08);
    }

    .sidebar{
      position: fixed;
      top:0;
      left:-320px;
      width:320px;
      height:100%;
      background:#0b1220;
      padding:20px;
      transition:0.3s;
      overflow-y:auto;
      z-index:999;
      border-right:1px solid rgba(255,255,255,0.08);
    }

    .sidebar.open{ left:0; }

    .overlay{
      position:fixed;
      top:0; left:0;
      width:100%; height:100%;
      background:rgba(0,0,0,0.5);
      display:none;
    }

    .overlay.show{ display:block; }

    .section-title{
      margin:15px 0 8px;
      font-size:13px;
      color:#9ca3af;
      text-transform:uppercase;
    }

    .checklist label{
      display:block;
      margin:8px 0;
      font-size:14px;
      cursor:pointer;
    }

    .checklist input{
      margin-right:8px;
    }

  </style>
</head>

<body>

<!-- MENU BUTTON -->
<div class="menu-btn" onclick="toggleSidebar()">☰</div>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
  <p></p>

  <div class="section-title">Categories</div>
  <div class="checklist">
    <label><input type="checkbox" value="Beauty/Health & Personal Care">Beauty/Health & Personal Care</label>
    <label><input type="checkbox" value="Pet Products">Pet Products</label>
    <label><input type="checkbox" value="Kitchen">Kitchen</label>
    <label><input type="checkbox" value="Home Improvement">Home Improvement</label>
    <label><input type="checkbox" value="Baby Products">Baby Products</label>
  </div>

  <div class="section-title">Brands</div>
  <div class="checklist">
    <label><input type="checkbox" value="CeraVe">CeraVe</label>
    <label><input type="checkbox" value="Cetaphil">Cetaphil</label>
    <label><input type="checkbox" value="Neutrogena">Neutrogena</label>
    <label><input type="checkbox" value="The Ordinary">The Ordinary</label>
  </div>

</div>

<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

<!-- YOUR ORIGINAL UI (UNCHANGED) -->
<div class="box">

  <div class="header">
    <h2>🚀 Amazon Scraping Dashboard</h2>
    <p>Smart Automation • DataFort Limited</p>
  </div>

  <div class="stats">
    <div class="card"><h3 id="totalRuns">0</h3><span>Total Runs</span></div>
    <div class="card"><h3 id="successRuns">0</h3><span>Success</span></div>
    <div class="card"><h3 id="failRuns">0</h3><span>Failed</span></div>
  </div>

  <div class="btn-group">
    <button id="btn" onclick="run()">▶ Run</button>
    <button id="downloadBtn" onclick="downloadSheet()">📥 CSV</button>
    <button id="clearBtn" onclick="clearLogs()">🗑 Clear</button>
  </div>

  <div class="status" id="status">Idle</div>

  <div class="progress"><div class="progress-bar" id="progress"></div></div>

  <div class="section-title">📜 Run History</div>

  <div class="logs" id="logs"></div>

</div>

<script>

const WEBHOOK_URL = "http://localhost:5678/webhook/87bd567e-11a3-4ab7-9d16-1c5c6b75200e";
const SHEET_URL = "https://docs.google.com/spreadsheets/d/16FTYRiC8lp3wBl-XJTtNyBKZYYSEnAWq9GJ21fgiiX8/export?format=csv";

/* SIDEBAR TOGGLE */
function toggleSidebar(){
  document.getElementById("sidebar").classList.toggle("open");
  document.getElementById("overlay").classList.toggle("show");
}

/* GET SELECTED VALUES */
function getSelected(){
  const categories = [...document.querySelectorAll(".sidebar input[type='checkbox']:checked")]
    .map(el => el.value);

  const brands = [...document.querySelectorAll(".sidebar input[type='checkbox']:checked")]
    .map(el => el.value);

  return { categories, brands };
}

/* YOUR ORIGINAL LOGIC (ONLY UPDATED BODY DATA) */
async function run(){
  const btn = document.getElementById("btn");
  const status = document.getElementById("status");
  const progress = document.getElementById("progress");
  const downloadBtn = document.getElementById("downloadBtn");

  const { categories, brands } = getSelected();

  btn.disabled = true;
  status.innerText = "⏳ Running...";
  progress.style.width = "30%";

  try{
    progress.style.width = "70%";

    await fetch(WEBHOOK_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ categories, brands })
    });

    status.innerText = "✅ Success";
    progress.style.width = "100%";
    downloadBtn.style.display="inline-block";

  }catch(e){
    status.innerText = "❌ Failed";
    progress.style.width = "100%";
  }

  btn.disabled=false;
  setTimeout(()=>progress.style.width="0%",1500);
}

function clearLogs(){
  document.getElementById("logs").innerHTML="";
}

function downloadSheet(){
  window.open(SHEET_URL,"_blank");
}

</script>

</body>
</html>
